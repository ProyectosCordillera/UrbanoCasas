<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer Etapa - Sistema Urbano</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/primer-etapa.css">
    <link rel="stylesheet" href="../css/styleReloj.css">
</head>

<body>
    <!-- Menú de navegación HORIZONTAL -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <div class="container-fluid">
            <!-- Logo - ✅ CORREGIDO: ruta ../img/ -->
            <a class="navbar-brand me-2 logo-container" href="https://proyectoscordillera.github.io/UrbanoCasas/index.html" title="Ir a Inicio">
                <img src="../img/LOGOSUNDARA.jpg" alt="Logo Sundara" class="img-fluid logo-img">
            </a>
            
            <!-- Botón para móviles -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Menú colapsable -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    
                    <!-- DROPDOWN: ETAPAS (7 etapas agrupadas) -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle menu-link" href="#" id="etapasDropdown" 
                           role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-layers me-2"></i>Etapas
                        </a>
                        <ul class="dropdown-menu dropdown-etapas" aria-labelledby="etapasDropdown">
                            <li><a class="dropdown-item" href="primer-etapa.html">
                                <i class="bi bi-1-circle me-2"></i>Primera Etapa</a></li>
                            <li><a class="dropdown-item" href="segunda-etapa.html">
                                <i class="bi bi-2-circle me-2"></i>Segunda Etapa</a></li>
                            <li><a class="dropdown-item" href="tercera-etapa.html">
                                <i class="bi bi-3-circle me-2"></i>Tercera Etapa</a></li>
                            <li><a class="dropdown-item" href="cuarta-etapa.html">
                                <i class="bi bi-4-circle me-2"></i>Cuarta Etapa</a></li>
                            <li><a class="dropdown-item" href="quinta-etapa.html">
                                <i class="bi bi-5-circle me-2"></i>Quinta Etapa</a></li>
                            <li><a class="dropdown-item" href="sexta-etapa.html">
                                <i class="bi bi-6-circle me-2"></i>Sexta Etapa</a></li>
                            <li><a class="dropdown-item" href="septima-etapa.html">
                                <i class="bi bi-7-circle me-2"></i>Séptima Etapa</a></li>
                        </ul>
                    </li>

                    <!-- DROPDOWN: INFORMES -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle menu-link" href="#" id="informesDropdown" 
                           role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-file-earmark-bar-graph me-2"></i>Informes
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="informesDropdown">
                            <li><a class="dropdown-item" href="informe-aplicados.html">
                                <i class="bi bi-file-earmark-text me-2"></i>Informe Aplicados</a></li>
                            <li><a class="dropdown-item" href="informe-etapas.html">
                                <i class="bi bi-file-earmark-ruled me-2"></i>Informe por Etapas</a></li>
                            <li><a class="dropdown-item" href="informe-general.html">
                                <i class="bi bi-file-earmark-bar-graph me-2"></i>Informe General</a></li>
                        </ul>
                    </li>
                    
                </ul>

                <!-- Reloj Digital -->
                <div class="clock-container">
                    <i class="bi bi-clock clock-icon"></i>
                    <div id="digitalClock" class="digital-clock">00:00:00</div>
                </div>
            </div>
        </div>
    </nav>
    <br />
    <br />
    
    <!-- Contenido principal -->
    <main class="container-fluid main-content">
        <div class="container mt-4 no-print">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex flex-wrap align-items-center gap-3">
                        <!-- Dropdown Marcas -->
                        <div class="flex-grow-1" style="min-width: 200px;">
                            <label class="form-label">Marcas existentes:</label>
                            <select id="ddlMarcas" class="form-select" onchange="cargarMarcaSeleccionada()">
                                <option value="0">Seleccione una marca</option>
                            </select>
                        </div>

                        <div class="flex-grow-1" style="min-width: 200px;">
                            <label class="form-label">Cliente:</label>
                            <input type="text" id="txtCliente" class="form-control" placeholder="nombre del cliente" />
                        </div>

                        <!-- Campo Número de Casa -->
                        <div class="flex-grow-1" style="min-width: 200px;">
                            <label class="form-label" for="txtNumeroCasa">Número de casa:</label>
                            <input type="text" id="txtNumeroCasa" class="form-control"
                                placeholder="digite el numero de casa" disabled />
                        </div>

                        <!-- Grupo de Botones -->
                        <div class="d-flex flex-wrap gap-2 align-self-end">
                            <button type="button" class="btn btn-primary shadow-sm" onclick="habilitarNumeroCasa()">
                                <i class="bi bi-plus-circle"></i> Nuevo
                            </button>
                            <button type="button" class="btn btn-info shadow-sm" onclick="marcarEnPlano()">
                                <i class="bi bi-check-circle"></i> Aplicar
                            </button>
                            <button type="button" class="btn btn-danger shadow-sm" onclick="eliminarMarca()">
                                <i class="bi bi-trash"></i> Eliminar
                            </button>
                            <button type="button" class="btn btn-success shadow-sm" onclick="imprimirPlano()">
                                <i class="bi bi-printer"></i> Imprimir
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="plano-container">
            <img id="imgPlano" src="../img/plano1.png" class="img-fluid" alt="Plano de la primera etapa" />
            <div id="marcadoresContainer"></div>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="page-footer fixed-bottom">
        <div class="container-fluid text-center">
            <span class="footer-text">© <span id="currentYear"></span> Sistema Urbano</span>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/script.js"></script>
    <script src="../js/RelojDigital.js"></script>
    <script src="../js/api-adapter.js"></script>
    <script src="../js/primer-etapa.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            console.log('🔍 Verificando estructura de carpetas...');
            console.log('📍 Página actual:', window.location.href);
            console.log('📍 Ruta base:', window.location.origin + window.location.pathname);

            if (window.location.protocol === 'file:') {
                console.warn('⚠️ ADVERTENCIA: Estás abriendo el HTML directamente (file://)');
                setTimeout(() => {
                    if (typeof Swal !== 'undefined') {
                        Swal.fire({
                            icon: 'warning',
                            title: '¡Atención!',
                            html: '<strong>Estás abriendo el archivo HTML directamente</strong><br><br>' +
                                '🔑 <strong>Solución:</strong><br>' +
                                '1. Instala la extensión "Live Server" en VS Code<br>' +
                                '2. Clic derecho en el archivo → "Open with Live Server"<br><br>' +
                                '⚠️ Sin Live Server, la base de datos NO funcionará',
                            confirmButtonText: 'Entendido',
                            allowOutsideClick: false
                        });
                    }
                }, 1000);
            } else {
                console.log('✅ Usando servidor web:', window.location.protocol);
            }
        });
    </script>

</body>

</html>
