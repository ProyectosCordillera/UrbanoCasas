<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe Aplicados - Sistema Urbano</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- TU CSS EXTERNO (Asegúrate de haber aplicado la corrección de overflow-x) -->
    <link rel="stylesheet" href="../css/informe-aplicados.css">
    
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- CONTENEDOR DEL MENÚ (Se carga desde includes/menu.html) -->
    <div id="menu-container"></div>

    <div class="container-fluid printable px-4 mt-4">
        
        <!-- Botones de Acción -->
        <div class="row mb-4 no-print g-2">
            <div class="col-md-4">
                <button id="btnImp" onclick="imprimirPlano()" class="btn btn-success w-100 fw-bold"><i class="bi bi-printer me-2"></i>Imprimir Plano</button>
            </div>
            <div class="col-md-4">
                <button id="btnActualizar" class="btn btn-primary w-100 fw-bold"><i class="bi bi-arrow-clockwise me-2"></i>Actualizar Datos</button>
            </div>
            <div class="col-md-4">
                <button onclick="verResumen()" class="btn btn-info w-100 text-white fw-bold"><i class="bi bi-bar-chart me-2"></i>Ver Resumen</button>
            </div>
        </div>

        <!-- SECCIÓN 1: TABLA DE DATOS -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fs-6"><i class="bi bi-list-ul me-2"></i>Listado de Casas Registradas</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle" id="tblCasas">
                        <thead class="table-dark">
                            <tr>
                                <th style="width: 10%">CASA</th>
                                <th>X</th> 
                                <th>Y</th> 
                                <th>CLIENTE</th>
                                <th style="width: 15%">FECHA</th>
                            </tr>
                        </thead>
                        <!-- ID CORREGIDO: tbodyDatos -->
                        <tbody id="tbodyDatos">
                            <tr><td colspan="5" class="text-center py-4 text-muted"> Cargando datos del sistema...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- SECCIÓN 2: PLANO GENERAL -->
        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fs-6"><i class="bi bi-map me-2"></i>Plano General con Marcadores</h5>
                <small class="d-none d-md-block opacity-75">Desliza horizontalmente si es necesario</small>
            </div>
            <div class="card-body p-0 bg-light">
                
                <!-- CLASE CORREGIDA: plano-container -->
                <div class="plano-container">
                    <!-- RUTA RELATIVA CORREGIDA PARA CARPETA PAGINAS -->
                    <img src="../img/plano_General.png" alt="Plano Sundara Flores" class="plano-image" id="imgPlano">
                    
                    <!-- ID CORREGIDO: marcadoresContainer -->
                    <div id="marcadoresContainer"></div>
                </div>

            </div>
        </div>

        <footer class="mt-4 pb-4 text-center text-muted small no-print">
            © Sistema Urbano - Cordillera | Generado automáticamente
        </footer>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script para cargar el menú dinámicamente -->
    <script>
        // Cargar el menú desde la carpeta includes
        fetch('../includes/menu.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-container').innerHTML = data;
            })
            .catch(error => console.error('Error cargando menú:', error));
    </script>

    <!-- TU JAVASCRIPT EXTERNO -->
    <script src="../js/informe-aplicados.js"></script>
</body>
</html>
