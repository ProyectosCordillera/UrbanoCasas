<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe Aplicados - Sistema Urbano</title>
    <!-- Asegúrate de vincular tu CSS aquí -->
    <link rel="stylesheet" href="informe-aplicados.css">
    <!-- Bootstrap o tus librerías actuales -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de Navegación (Mantenida) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 no-print">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">SUNDARA FLORES</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Etapas</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Informes</a></li>
                </ul>
                <span class="navbar-text text-white" id="clock">14:59:52</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid printable px-4">
        
        <!-- Botones de Acción (Solo visibles en pantalla) -->
        <div class="row mb-4 no-print">
            <div class="col-md-4">
                <button id="btnImp" class="btn btn-success w-100">🖨️ Imprimir Plano</button>
            </div>
            <div class="col-md-4">
                <button id="btnActualizar" class="btn btn-primary w-100">🔄 Actualizar Datos</button>
            </div>
            <div class="col-md-4">
                <button class="btn btn-info w-100 text-white">📊 Ver Resumen</button>
            </div>
        </div>

        <!-- SECCIÓN 1: TABLA DE DATOS (Ancho completo arriba) -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">📋 Listado de Casas Registradas</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0" id="tblCasas">
                        <thead class="table-dark">
                            <tr>
                                <th>NÚMERO CASA</th>
                                <th>COORDENADA X</th> <!-- Oculto por CSS pero útil para lógica -->
                                <th>COORDENADA Y</th> <!-- Oculto por CSS pero útil para lógica -->
                                <th>CLIENTE</th>
                                <th>FECHA</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Los datos se cargan dinámicamente, dejo estructura de ejemplo -->
                            <tr><td colspan="5" class="text-center">Cargando datos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- SECCIÓN 2: PLANO GENERAL (Ancho completo abajo) -->
        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0">🗺️ Plano General con Marcadores</h5>
            </div>
            <div class="card-body p-0 bg-light text-center">
                
                <!-- Contenedor del Plano con Scroll Horizontal si es necesario -->
                <div class="plano-container">
                    <!-- Reemplaza 'plano-sundara.jpg' con la ruta real de tu imagen -->
                    <img src="plano-sundara.jpg" alt="Plano Sundara Flores" class="plano-image" id="imgPlano">
                    
                    <!-- Los marcadores se generan aquí vía JS -->
                    <div id="contenedor-marcadores"></div>
                </div>

            </div>
        </div>

        <footer class="mt-4 text-center text-muted small no-print">
            © Sistema Urbano - Cordillera
        </footer>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Tu lógica de JS para cargar datos y poner marcadores va aquí
    </script>
</body>
</html>
