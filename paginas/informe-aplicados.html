<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe Aplicados - Sistema Urbano</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Tu CSS Personalizado -->
    <style>
        /* ESTILOS PARA EL PLANO Y MARCADORES */
        .plano-wrapper {
            position: relative;
            width: 100%;
            overflow-x: auto; /* Permite scroll lateral si la pantalla es pequeña */
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
        }

        .plano-image {
            display: block;
            margin: 0 auto;
            min-width: 1400px; /* Fuerza el ancho real del plano para que no se vea pequeño */
            height: auto;
            user-select: none;
        }

        .marcador {
            position: absolute;
            width: 28px;
            height: 28px;
            background-color: rgba(13, 110, 253, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .marcador:hover {
            transform: translate(-50%, -50%) scale(1.3);
            z-index: 20;
            background-color: #0d6efd;
        }

        /* Ocultar columnas de coordenadas visualmente pero mantenerlas en DOM */
        #tblCasas th:nth-child(2), #tblCasas td:nth-child(2),
        #tblCasas th:nth-child(3), #tblCasas td:nth-child(3) {
            display: none !important;
        }

        /* =========================================
           ESTILOS DE IMPRESIÓN OPTIMIZADOS
           ========================================= */
        @media print {
            @page {
                size: A4 landscape; /* Hoja horizontal obligatoria para planos anchos */
                margin: 5mm;
            }

            body { 
                background-color: white !important; 
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .no-print { display: none !important; }
            
            .printable {
                width: 100% !important;
                max-width: none !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .card { 
                border: none !important; 
                box-shadow: none !important; 
                margin-bottom: 10px !important; 
            }
            
            .card-header { 
                background-color: #eee !important; 
                color: black !important; 
                border-bottom: 1px solid #ccc;
                font-weight: bold;
            }

            table { font-size: 9pt !important; width: 100% !important; }
            
            /* Ajuste crítico del plano para impresión */
            .plano-wrapper {
                overflow: visible !important;
                border: none !important;
                background: transparent !important;
            }

            .plano-image {
                min-width: unset !important;
                width: 100% !important;
                height: auto !important;
                object-fit: contain;
            }

            .marcador {
                width: 18px !important;
                height: 18px !important;
                font-size: 8px !important;
                border-width: 1px !important;
            }
        }
    </style>
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 no-print">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">SUNDARA FLORES</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Etapas</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Informes</a></li>
                </ul>
                <span class="navbar-text text-white font-monospace" id="clock">--:--:--</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid printable px-4">
        
        <!-- Botones de Acción -->
        <div class="row mb-4 no-print g-2">
            <div class="col-md-4">
                <button id="btnImp" onclick="window.print()" class="btn btn-success w-100 fw-bold">️ Imprimir Plano</button>
            </div>
            <div class="col-md-4">
                <button id="btnActualizar" class="btn btn-primary w-100 fw-bold"> Actualizar Datos</button>
            </div>
            <div class="col-md-4">
                <button class="btn btn-info w-100 text-white fw-bold">📊 Ver Resumen</button>
            </div>
        </div>

        <!-- SECCIÓN 1: TABLA -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fs-6">📋 Listado de Casas Registradas</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle" id="tblCasas">
                        <thead class="table-dark">
                            <tr>
                                <th style="width: 10%">CASA</th>
                                <th>X</th> <!-- Oculto por CSS -->
                                <th>Y</th> <!-- Oculto por CSS -->
                                <th>CLIENTE</th>
                                <th style="width: 15%">FECHA</th>
                            </tr>
                        </thead>
                        <tbody id="tablaBody">
                            <tr><td colspan="5" class="text-center py-4 text-muted">Cargando datos del sistema...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- SECCIÓN 2: PLANO -->
        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fs-6">🗺️ Plano General con Marcadores</h5>
                <small class="d-none d-md-block opacity-75">Desliza horizontalmente si es necesario</small>
            </div>
            <div class="card-body p-0 bg-light">
                
                <div class="plano-wrapper">
                    <!-- IMPORTANTE: Asegúrate de que esta imagen exista en tu carpeta o usa una URL válida -->
                    <img src="plano-sundara.jpg" alt="Plano Sundara Flores" class="plano-image" id="imgPlano">
                    
                    <!-- Contenedor donde JS inyectará los marcadores -->
                    <div id="contenedor-marcadores"></div>
                </div>

            </div>
        </div>

        <footer class="mt-4 pb-4 text-center text-muted small no-print">
            © Sistema Urbano - Cordillera | Generado automáticamente
        </footer>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script Principal -->
    <script>
        // Reloj en tiempo real
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('es-CR');
        }, 1000);

        // ==========================================
        // LÓGICA DE DATOS Y MARCADORES
        // ==========================================
        
        // Ejemplo de cómo deberías cargar tus datos
        // Reemplaza esto con tu fetch() a la API o JSON
        const casasData = [
            // { numero: 1, x: 50, y: 30, cliente: "Juan Perez", fecha: "2023-10-01" },
        ];

        function renderTabla(data) {
            const tbody = document.getElementById('tablaBody');
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4">No hay registros encontrados.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(casa => `
                <tr>
                    <td class="fw-bold">${casa.numero}</td>
                    <td>${casa.x}</td>
                    <td>${casa.y}</td>
                    <td>${casa.cliente}</td>
                    <td><small class="text-muted">${casa.fecha}</small></td>
                </tr>
            `).join('');
        }

        function renderMarcadores(data) {
            const container = document.getElementById('contenedor-marcadores');
            container.innerHTML = '';
            
            data.forEach(casa => {
                const marker = document.createElement('div');
                marker.className = 'marcador';
                marker.textContent = casa.numero;
                marker.title = casa.cliente;
                
                // Posicionamiento basado en porcentajes o píxeles según tu lógica
                marker.style.left = `${casa.x}%`; 
                marker.style.top = `${casa.y}%`;
                
                container.appendChild(marker);
            });
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            // Simulación de carga - REEMPLAZAR CON TU LÓGICA REAL
            // fetch('tu-api-o-json').then(res => res.json()).then(data => { ... });
            
            // Por ahora dejamos el mensaje de carga o datos de prueba
            console.log("Sistema listo. Esperando datos...");
        });

    </script>
</body>
</html>
