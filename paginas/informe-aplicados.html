<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe Aplicados - Sistema Urbano</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- TU CSS EXTERNO -->
    <link rel="stylesheet" href="informe-aplicados.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 no-print">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">SUNDARA FLORES</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Etapas</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Informes</a></li>
                </ul>
                <span class="navbar-text text-white font-monospace" id="clock">--:--:--</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid printable px-4">
        
        <!-- Botones de Acción -->
        <div class="row mb-4 no-print g-2">
            <div class="col-md-4">
                <button id="btnImp" onclick="imprimirPlano()" class="btn btn-success w-100 fw-bold">🖨️ Imprimir Plano</button>
            </div>
            <div class="col-md-4">
                <button id="btnActualizar" class="btn btn-primary w-100 fw-bold">🔄 Actualizar Datos</button>
            </div>
            <div class="col-md-4">
                <button onclick="verResumen()" class="btn btn-info w-100 text-white fw-bold">📊 Ver Resumen</button>
            </div>
        </div>

        <!-- SECCIÓN 1: TABLA DE DATOS -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fs-6">📋 Listado de Casas Registradas</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle" id="tblCasas">
                        <thead class="table-dark">
                            <tr>
                                <th style="width: 10%">CASA</th>
                                <th>X</th> 
                                <th>Y</th> 
                                <th>CLIENTE</th>
                                <th style="width: 15%">FECHA</th>
                            </tr>
                        </thead>
                        <!-- ID CORREGIDO: tbodyDatos (requerido por tu JS) -->
                        <tbody id="tbodyDatos">
                            <tr><td colspan="5" class="text-center py-4 text-muted"> Cargando datos del sistema...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- SECCIÓN 2: PLANO GENERAL -->
        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fs-6">️ Plano General con Marcadores</h5>
                <small class="d-none d-md-block opacity-75">Desliza horizontalmente si es necesario</small>
            </div>
            <div class="card-body p-0 bg-light">
                
                <!-- CLASE CORREGIDA: plano-container (para coincidir con CSS) -->
                <div class="plano-container">
                   <!-- RUTA CORREGIDA: Sube un nivel (..) y busca en img con extensión .png -->
<img src="../img/plano_General.png" alt="Plano Sundara Flores" class="plano-image" id="imgPlano">
                    <!-- ID CORREGIDO: marcadoresContainer (requerido por tu JS) -->
                    <div id="marcadoresContainer"></div>
                </div>

            </div>
        </div>

        <footer class="mt-4 pb-4 text-center text-muted small no-print">
            © Sistema Urbano - Cordillera | Generado automáticamente
        </footer>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- TU JAVASCRIPT EXTERNO -->
    <script src="informe-aplicados.js"></script>
</body>
</html>
