<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Coordenadas - Local</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        #planoContainer {
            position: relative;
            display: inline-block;
            margin: 20px 0;
        }
        #imgPlano {
            max-width: 100%;
            height: auto;
            cursor: crosshair;
            display: block;
        }
        #marcador {
            position: absolute;
            width: 30px;
            height: 30px;
            background: red;
            border: 3px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
            z-index: 9999;
        }
        #coordenadas {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        .instrucciones {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎯 Obtener Coordenadas del Plano</h2>
        
        <div class="instrucciones">
            <strong>Instrucciones:</strong>
            <ol>
                <li>Haz clic EXACTAMENTE en el centro del número <strong>66</strong></li>
                <li>Copia las coordenadas que aparecen</li>
                <li>Repite con <strong>81, 82 y 97</strong></li>
                <li>Envíame esas 4 coordenadas</li>
            </ol>
        </div>

        <div id="planoContainer">
            <img id="imgPlano" src="../img/plano3.png" alt="Plano" />
            <div id="marcador"></div>
        </div>
    </div>

    <div id="coordenadas">
        <strong>📍 Coordenadas:</strong><br>
        <span id="coordTexto">Haz clic en el número 66</span>
    </div>

    <script>
        const PLANO_ANCHO = 1275;
        const PLANO_ALTO = 1650;
        
        const imgPlano = document.getElementById('imgPlano');
        const marcador = document.getElementById('marcador');
        const coordTexto = document.getElementById('coordTexto');
        const planoContainer = document.getElementById('planoContainer');
        
        imgPlano.addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const sistemaX = Math.round((x / rect.width) * PLANO_ANCHO);
            const sistemaY = Math.round((y / rect.height) * PLANO_ALTO);
            
            // Mostrar marcador
            marcador.style.left = x + 'px';
            marcador.style.top = y + 'px';
            marcador.style.display = 'block';
            
            // Mostrar coordenadas
            const texto = `X: ${sistemaX}, Y: ${sistemaY}`;
            coordTexto.innerHTML = `<strong>${texto}</strong><br><small>Copia esto</small>`;
            
            // Copiar al portapapeles
            navigator.clipboard.writeText(`{ x: ${sistemaX}, y: ${sistemaY} }`);
            
            console.log(`Coordenadas: { x: ${sistemaX}, y: ${sistemaY} }`);
            
            alert(`Coordenadas:\n${texto}\n\n(Copiadas al portapapeles)`);
        });
    </script>
</body>
</html>
